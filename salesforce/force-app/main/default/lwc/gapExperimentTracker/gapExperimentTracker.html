<template>
    <lightning-card title="Open Research Gaps &amp; Proposed Experiments" icon-name="custom:custom83">
        <div slot="actions">
            <lightning-button label="Refresh" onclick={handleRefresh}></lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-spinner alternative-text="Loading research gaps" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasGaps}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <template for:each={gapCards} for:item="gap">
                            <div key={gap.Id} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 slds-m-bottom_medium">
                                <article class="gap-card">
                                    <div class="card-meta-row">
                                        <span class="tag-pill">{gap.Priority__c}</span>
                                        <span class="complexity-pill">{gap.Estimated_Complexity__c} Complexity</span>
                                        <span class="status-indicator">{gap.Status__c}</span>
                                    </div>

                                    <h4 class="problem-text">
                                        <strong>{gap.Problem_Statement__c}</strong>
                                    </h4>

                                    <div class="experiment-box">
                                        <p class="experiment-label">
                                            Suggested Experimental Methodology:
                                        </p>
                                        <p class="experiment-desc">{gap.Proposed_Experiment__c}</p>
                                    </div>

                                    <!-- Quick Status Transition Action -->
                                    <div class="action-bar">
                                        <span class="action-label">Status:</span>
                                        <lightning-button-group class="slds-m-left_small">
                                            <lightning-button
                                                label="In Review"
                                                variant="neutral"
                                                data-id={gap.Id}
                                                data-status="In Review"
                                                onclick={handleStatusChange}
                                                disabled={gap.isInReview}>
                                            </lightning-button>
                                            <lightning-button
                                                label="Drafted"
                                                variant="neutral"
                                                data-id={gap.Id}
                                                data-status="Experiment Drafted"
                                                onclick={handleStatusChange}
                                                disabled={gap.isDrafted}>
                                            </lightning-button>
                                            <lightning-button
                                                label="Addressed"
                                                variant="brand"
                                                data-id={gap.Id}
                                                data-status="Addressed"
                                                onclick={handleStatusChange}
                                                disabled={gap.isAddressed}
                                                class="black-btn">
                                            </lightning-button>
                                        </lightning-button-group>
                                    </div>
                                </article>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasGaps}>
                    <div class="empty-state">
                        <p class="empty-title">No Research Gaps Identified</p>
                        <p class="empty-desc">This topic map currently has no unresolved gaps or proposed experiments recorded.</p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
