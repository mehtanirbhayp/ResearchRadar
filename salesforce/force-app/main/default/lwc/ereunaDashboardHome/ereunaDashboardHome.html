<template>
    <div class="dashboard-wrapper">
        <!-- Metric KPI Summary Header -->
        <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-m-bottom_small">
                <div class="kpi-card">
                    <span class="kpi-label">RESEARCH MAPS</span>
                    <h2 class="kpi-value">{totalMapsCount}</h2>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-m-bottom_small">
                <div class="kpi-card">
                    <span class="kpi-label">CATALOGED PAPERS</span>
                    <h2 class="kpi-value">{totalPapersCount}</h2>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-m-bottom_small">
                <div class="kpi-card">
                    <span class="kpi-label">VERIFIED FINDINGS</span>
                    <h2 class="kpi-value">{totalFindingsCount}</h2>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-m-bottom_small">
                <div class="kpi-card">
                    <span class="kpi-label">ACTIVE GAPS</span>
                    <h2 class="kpi-value">{totalGapsCount}</h2>
                </div>
            </div>
        </div>

        <!-- Topic Search and Synthesis Engine -->
        <div class="slds-m-bottom_medium">
            <c-ereuna-topic-search onmapsynthesized={handleMapSynthesized}></c-ereuna-topic-search>
        </div>

        <div class="slds-grid slds-wrap slds-gutters">
            <!-- Left: Quick Topic Navigation -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 slds-m-bottom_medium">
                <lightning-card title="Synthesized Research Topics" icon-name="standard:topic">
                    <div class="slds-p-around_medium">
                        <template if:true={hasRecentMaps}>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" style="width: 45%;"><div class="slds-truncate" title="Topic">Topic</div></th>
                                        <th scope="col" style="width: 25%;"><div class="slds-truncate" title="Discipline">Discipline</div></th>
                                        <th scope="col" style="width: 15%;"><div class="slds-truncate" title="Status">Status</div></th>
                                        <th scope="col" style="width: 15%;"><div class="slds-truncate" title="Action">Action</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={recentMaps} for:item="map">
                                        <tr key={map.Id} class="clickable-row">
                                            <td>
                                                <a href="javascript:void(0);" onclick={handleNavigateToMap} data-id={map.Id} class="table-link">
                                                    {map.Topic__c}
                                                </a>
                                            </td>
                                            <td>
                                                <span>{map.Target_Discipline__c}</span>
                                            </td>
                                            <td>
                                                <span class="tag-pill-subtle">{map.Status__c}</span>
                                            </td>
                                            <td>
                                                <button class="action-btn" onclick={handleNavigateToMap} data-id={map.Id}>
                                                    Open Workspace &rarr;
                                                </button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={hasRecentMaps}>
                            <div class="empty-state">
                                <p class="empty-title">No synthesized maps available.</p>
                                <p class="empty-desc">Use the Literature Synthesis Engine above to create your first research map.</p>
                            </div>
                        </template>
                    </div>
                </lightning-card>
            </div>

            <!-- Right: Quick Actions -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-m-bottom_medium">
                <lightning-card title="System Operations" icon-name="standard:settings">
                    <div class="slds-p-around_medium">
                        <div class="quick-action-list">
                            <button class="quick-action-item" onclick={handleNavigateToPapers}>
                                <strong>Research Papers Catalog</strong>
                                <span>Browse indexed papers &amp; benchmarks</span>
                            </button>
                            <button class="quick-action-item" onclick={handleNavigateToGaps}>
                                <strong>Research Gap Board</strong>
                                <span>Track validation experiments &amp; protocols</span>
                            </button>
                            <button class="quick-action-item" onclick={handleNavigateToMaps}>
                                <strong>Research Maps Hub</strong>
                                <span>View all topic syntheses &amp; clusters</span>
                            </button>
                            <button class="quick-action-item" onclick={handleNavigateToFindings}>
                                <strong>Verified Findings &amp; Evidence</strong>
                                <span>Inspect quotes and confidence scores</span>
                            </button>
                        </div>
                    </div>
                </lightning-card>
            </div>
        </div>
    </div>
</template>
