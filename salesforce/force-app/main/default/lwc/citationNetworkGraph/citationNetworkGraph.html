<template>
    <lightning-card title="Research Lineage &amp; Citation Timeline" icon-name="standard:timeline">
        <div slot="actions" class="actions-group">
            <lightning-button-group>
                <lightning-button
                    label="Chronological Timeline"
                    variant={isSortChronological}
                    onclick={handleSetChronological}>
                </lightning-button>
                <lightning-button
                    label="By Citation Impact"
                    variant={isSortCitations}
                    onclick={handleSetCitations}>
                </lightning-button>
            </lightning-button-group>
            <lightning-button
                label="Reset"
                icon-name="utility:refresh"
                onclick={handleResetView}
                class="slds-m-left_x-small">
            </lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <div class="slds-p-around_large slds-text-align_center">
                    <lightning-spinner alternative-text="Loading literature timeline" size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasData}>
                    <!-- Metric Summary Strip -->
                    <div class="summary-strip slds-m-bottom_medium">
                        <div class="summary-item">
                            <span class="summary-label">Timeline Span</span>
                            <span class="summary-val">{yearSpan}</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Cluster Citations</span>
                            <span class="summary-val">{totalCitations}</span>
                        </div>
                        <div class="summary-item">
                            <span class="summary-label">Foundational Anchor</span>
                            <span class="summary-val-truncate" title={foundationalPaper.label}>{foundationalPaper.label}</span>
                        </div>
                    </div>

                    <!-- Main Timeline + Inspector Grid -->
                    <div class="slds-grid slds-wrap slds-gutters">
                        <!-- Left: Chronological Progression Track -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12 slds-m-bottom_small">
                            <div class="timeline-container">
                                <template for:each={papersList} for:item="paper">
                                    <div key={paper.id} class="timeline-entry">
                                        <!-- Step Marker Icon -->
                                        <div class="timeline-marker">
                                            <span class="marker-number">{paper.yearText}</span>
                                        </div>

                                        <!-- Timeline Card Content -->
                                        <div class={paper.cardClass} onclick={handleSelectPaper} data-id={paper.id}>
                                            <div class="card-header-row">
                                                <span class={paper.rolePillClass}>{paper.lineageRole}</span>
                                                <span class="pill-citations">{paper.citationsLabel}</span>
                                            </div>

                                            <h3 class="paper-title">{paper.label}</h3>

                                            <div class="paper-meta-row">
                                                <span class="paper-authors">{paper.authors}</span>
                                                <span class="meta-dot">&bull;</span>
                                                <span class="paper-venue">{paper.venueText}</span>
                                            </div>

                                            <div class="lineage-callout">
                                                <span class="callout-label">Lineage Role:</span>
                                                <span class="callout-text">{paper.lineageExplanation}</span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Right: Detailed Inspector Panel -->
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12 slds-m-bottom_small">
                            <template if:true={selectedPaper}>
                                <div class="inspector-panel">
                                    <div class="inspector-top-row">
                                        <span class={selectedPaper.rolePillClass}>{selectedPaper.lineageRole}</span>
                                        <span class="pill-citations">{selectedPaper.citationsLabel}</span>
                                    </div>

                                    <h2 class="inspector-title">{selectedPaper.label}</h2>
                                    <p class="inspector-authors"><strong>Authors:</strong> {selectedPaper.authors}</p>

                                    <div class="inspector-grid">
                                        <div class="inspector-grid-item">
                                            <span class="grid-label">Publication Year</span>
                                            <span class="grid-value">{selectedPaper.yearText}</span>
                                        </div>
                                        <div class="inspector-grid-item">
                                            <span class="grid-label">Primary Discipline</span>
                                            <span class="grid-value">{selectedPaper.discipline}</span>
                                        </div>
                                    </div>

                                    <div class="inspector-section">
                                        <span class="section-heading">Venue / Proceedings</span>
                                        <p class="section-content">{selectedPaper.venueText}</p>
                                    </div>

                                    <div class="inspector-section">
                                        <span class="section-heading">Evolutionary Context</span>
                                        <p class="section-content">{selectedPaper.lineageExplanation}</p>
                                    </div>

                                    <template if:true={selectedPaper.url}>
                                        <a href={selectedPaper.url} target="_blank" rel="noopener noreferrer" class="black-action-btn">
                                            Open Research Article &rarr;
                                        </a>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <template if:false={hasData}>
                    <div class="empty-state">
                        <p class="empty-title">No Literature Milestones Available</p>
                        <p class="empty-desc">Link peer-reviewed research papers to this map to generate the chronological lineage timeline.</p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
